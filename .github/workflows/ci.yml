name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

  prose:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      # ai-tells bans em dashes and other AI-written prose patterns.  The style package is pinned in
      # ``.vale.ini`` and ``vale sync`` downloads it into the gitignored
      # ``styles`` directory.
      - name: Sync Vale styles
        run: uvx vale@3.13.0.0 sync
      - name: Lint prose
        run: git ls-files '*.md' | xargs --no-run-if-empty uvx vale@3.13.0.0
